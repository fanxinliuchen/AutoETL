server:
  # 端口刻意避开集团其他项目已占用的段位(3000-3020 前端 / 8050-8100、8888-9003 后端)
  port: 8388

spring:
  application:
    name: dhp-biz-etl-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

# MyBatis-Plus 基础配置
mybatis-plus:
  type-enums-package: com.dhp.etl.enums
  global-config:
    db-config:
      logic-delete-field: objectStatusCd
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# 安全配置密钥 (可由环境变量 JASYPT_ENCRYPTOR_PASSWORD 或 ETL_CIPHER_KEY 覆盖)
etl:
  security:
    cipher-key: ${ETL_CIPHER_KEY:DhpEtlSecretKey2026!@#}

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
